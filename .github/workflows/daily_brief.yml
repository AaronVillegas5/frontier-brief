name: The Frontier Brief — Daily Newsletter

on:
  schedule:
    # Run daily at 09:00 AM UTC (4 AM EST / 3 AM CST)
    - cron: "0 9 * * *"
  workflow_dispatch:
    # Manual trigger for testing

permissions:
  contents: write  # needed to commit topic_history.json and push to gh-pages

jobs:
  generate-and-deliver:
    name: Generate & Deliver Newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run newsletter pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py

      - name: Commit trend history
        # Commits data/topic_history.json back to main so the next run
        # can read the rolling topic window for trend detection.
        run: |
          git config user.name "frontier-brief[bot]"
          git config user.email "frontier-brief[bot]@users.noreply.github.com"
          git add data/topic_history.json || true
          git diff --staged --quiet || git commit -m "chore(data): update topic history [skip ci]"
          git push origin HEAD:main || true

      - name: Publish archive to GitHub Pages
        # Copies the archive/ directory to the gh-pages branch so each
        # edition is permanently accessible at USERNAME.github.io/frontier-brief/
        run: |
          git config user.name "frontier-brief[bot]"
          git config user.email "frontier-brief[bot]@users.noreply.github.com"

          # Stash the freshly-generated archive/ directory
          cp -r archive /tmp/frontier-archive

          # Switch to gh-pages (create orphan branch on first run)
          git fetch origin gh-pages 2>/dev/null && git checkout gh-pages \
            || git checkout --orphan gh-pages && git rm -rf . --quiet

          # Copy archive files in
          cp -r /tmp/frontier-archive/* . 2>/dev/null || true

          # Regenerate index.html to include all past editions
          cat << 'EOF' > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>The Frontier Brief — Archive</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                      max-width: 600px; margin: 40px auto; padding: 0 20px; color: #1a1a2e; }
              h1 { font-size: 22px; border-bottom: 2px solid #1a1a2e; padding-bottom: 10px; }
              ul { list-style: none; padding: 0; }
              li { padding: 8px 0; border-bottom: 1px solid #eee; }
              a { color: #4a90d9; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .subtitle { color: #888; font-size: 13px; margin-top: -10px; }
            </style>
          </head>
          <body>
            <h1>The Frontier Brief</h1>
            <p class="subtitle">Signal, not noise. Daily AI newsletter — past editions.</p>
            <ul>
          EOF
          
          # Find all HTML files starting with 20, sort descending, and append to list
          for file in $(ls 20*.html 2>/dev/null | sort -r); do
            date_str="${file%.html}"
            echo "      <li><a href=\"$file\">The Frontier Brief — $date_str</a></li>" >> index.html
          done
          echo "  </ul></body></html>" >> index.html

          # Commit and push
          git add -A
          git diff --staged --quiet \
            || git commit -m "archive: publish edition $(date -u '+%Y-%m-%d') [skip ci]"
          git push origin gh-pages || true

          # Return to main
          git checkout main
