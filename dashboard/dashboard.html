<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Frontier Brief — Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9fb;
      color: #1a1a2e;
      min-height: 100vh;
    }
    .container {
      max-width: 560px;
      margin: 40px auto;
      padding: 0 20px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 22px;
      border-bottom: 2px solid #1a1a2e;
      display: inline-block;
      padding-bottom: 6px;
    }
    header p {
      color: #888;
      font-size: 13px;
      margin-top: 6px;
    }

    /* Login */
    #login-section { text-align: center; margin-top: 60px; }
    #login-section p { margin-bottom: 20px; color: #555; }
    .btn-github {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-github:hover { background: #2d2d4e; }
    .btn-github svg { width: 20px; height: 20px; fill: white; }

    /* Form */
    #config-section { display: none; }
    .card {
      background: #fff;
      border: 1px solid #e8e8ec;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 12px;
    }
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .checkbox-group label:has(input:checked) {
      background: #e8f0fe;
      border-color: #4a90d9;
      color: #1a1a2e;
    }
    .checkbox-group input[type="checkbox"] { accent-color: #4a90d9; }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      background: #fff;
    }

    /* Telemetry toggle */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .toggle-row span { font-size: 13px; color: #555; }
    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 24px;
      cursor: pointer;
      transition: 0.3s;
    }
    .toggle .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle input:checked + .slider { background: #4a90d9; }
    .toggle input:checked + .slider::before { transform: translateX(20px); }

    /* Buttons */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .btn-save {
      flex: 1;
      padding: 12px;
      background: #4a90d9;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { background: #3a7bc8; }
    .btn-save:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Status */
    .status {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }
    .status.success { display: block; background: #d4edda; color: #155724; }
    .status.error { display: block; background: #f8d7da; color: #721c24; }
    .status.loading { display: block; background: #e8f0fe; color: #1a1a2e; }

    .user-info {
      text-align: center;
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
    }
    .user-info strong { color: #1a1a2e; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>The Frontier Brief</h1>
      <p>Configure your newsletter preferences</p>
    </header>

    <!-- Login -->
    <div id="login-section">
      <p>Sign in with GitHub to configure your forked newsletter settings.</p>
      <a id="login-btn" class="btn-github" href="#">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        Sign in with GitHub
      </a>
    </div>

    <!-- Config Form (hidden until logged in) -->
    <div id="config-section">
      <div class="user-info">
        Signed in as <strong id="username"></strong> · <a href="#" id="logout-btn" style="color:#4a90d9;">Sign out</a>
      </div>

      <div class="card">
        <h2>Topic Focus</h2>
        <div class="checkbox-group" id="topics">
          <label><input type="checkbox" value="artificial intelligence"> AI General</label>
          <label><input type="checkbox" value="large language models"> LLMs</label>
          <label><input type="checkbox" value="AI agents"> Agents</label>
          <label><input type="checkbox" value="AI safety"> Safety</label>
          <label><input type="checkbox" value="open source AI"> Open Source</label>
          <label><input type="checkbox" value="cybersecurity"> Security</label>
          <label><input type="checkbox" value="computer vision"> Vision</label>
          <label><input type="checkbox" value="robotics"> Robotics</label>
        </div>
      </div>

      <div class="card">
        <h2>Audience Tone</h2>
        <select id="audience">
          <option value="non-technical business owner">Non-Technical Business Owner</option>
          <option value="developer">Developer / Engineer</option>
          <option value="investor">Investor / VC</option>
          <option value="AI researcher">AI Researcher</option>
        </select>
      </div>

      <div class="card">
        <h2>Preferred Sources</h2>
        <div class="checkbox-group" id="preferred-sources">
          <label><input type="checkbox" value="OpenAI"> OpenAI</label>
          <label><input type="checkbox" value="Google DeepMind"> DeepMind</label>
          <label><input type="checkbox" value="Anthropic"> Anthropic</label>
          <label><input type="checkbox" value="Meta AI"> Meta AI</label>
          <label><input type="checkbox" value="Hugging Face"> Hugging Face</label>
          <label><input type="checkbox" value="Mistral"> Mistral</label>
        </div>
      </div>

      <div class="card">
        <h2>Excluded Sources</h2>
        <div class="checkbox-group" id="excluded-sources">
          <label><input type="checkbox" value="OpenAI"> OpenAI</label>
          <label><input type="checkbox" value="Google DeepMind"> DeepMind</label>
          <label><input type="checkbox" value="Anthropic"> Anthropic</label>
          <label><input type="checkbox" value="Meta AI"> Meta AI</label>
          <label><input type="checkbox" value="Hugging Face"> Hugging Face</label>
          <label><input type="checkbox" value="Mistral"> Mistral</label>
        </div>
      </div>

      <div class="card">
        <h2>Privacy</h2>
        <div class="toggle-row">
          <span>Allow anonymous open-rate telemetry</span>
          <label class="toggle">
            <input type="checkbox" id="telemetry" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="actions">
        <button class="btn-save" id="save-btn">Save Settings</button>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
